name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Bundle HTML presentation and architecture diagrams into Pages artifact
        run: |
          mkdir -p dist/presentations dist/docs/presentations
          cp docs/presentations/ui-test-solution-v3.html dist/presentations/index.html
          cp docs/presentations/ui-test-solution-v3.html dist/presentations/ui-test-solution-v3.html
          cp docs/presentations/*.html docs/presentations/*.svg docs/presentations/*.png dist/docs/presentations/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
